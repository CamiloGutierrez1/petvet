server:
  port: 8082

spring:
  application:
    name: ms-citas-historial
  datasource:
    url: jdbc:postgresql://localhost:5434/citas
    username: ${PETVET_DB_USER:petvet}
    password: ${PETVET_DB_PASSWORD:petvet_local}
  flyway:
    # El historial de ejemplo (db/demo) es una migración repetible opcional. Si se aplicó con el
    # Compose de demo y luego el servicio arranca sin esa carpeta sobre el mismo volumen, Flyway la
    # vería como "missing" y no dejaría arrancar. Se tolera solo ese caso, además del valor por defecto.
    ignore-migration-patterns: "*:future,repeatable:missing"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Carga por lotes las listas del historial (vacunas, tratamientos y exámenes) y evita tres consultas por registro.
        default_batch_fetch_size: 50
  task:
    scheduling:
      pool:
        # Un hilo para la outbox y otro para los recordatorios, para que una tarea lenta no retrase a la otra.
        size: 2
  rabbitmq:
    host: localhost
    port: 5672
    username: ${PETVET_RABBITMQ_USER:petvet}
    password: ${PETVET_RABBITMQ_PASSWORD:petvet_local}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

petvet:
  cors:
    allowed-origins: ${PETVET_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mascotas:
    url: ${PETVET_MASCOTAS_URL:http://localhost:8081}
  agenda:
    zona: ${PETVET_AGENDA_ZONA:America/Bogota}
    apertura: ${PETVET_AGENDA_APERTURA:08:00}
    cierre: ${PETVET_AGENDA_CIERRE:18:00}
    duracion-minutos: ${PETVET_AGENDA_DURACION_MINUTOS:30}
  eventos:
    habilitados: ${PETVET_EVENTOS_HABILITADOS:true}
    intervalo-ms: ${PETVET_EVENTOS_INTERVALO_MS:5000}
  vacunas:
    habilitadas: ${PETVET_VACUNAS_HABILITADAS:true}
    cron: ${PETVET_VACUNAS_CRON:0 0 8 * * *}
    dias-aviso: ${PETVET_VACUNAS_DIAS_AVISO:7}
