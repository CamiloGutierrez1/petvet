server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Archivos con hash en el nombre (assets/index-AbC123.js): caché larga.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier ruta del front (/dueno/citas, /veterinario/agenda...)
  # devuelve index.html y React Router decide qué mostrar. Sin esto, recargar
  # la página en una ruta interna daría 404.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
